{% extends "base.html" %}
{% block content %}
<div class="dashboard-layout">
    <!-- CỘT TRÁI -->
    <aside class="sidebar-left">
        <div class="sidebar-header">Phase 1 & 2</div>
        <div id="tree-left"></div>
    </aside>

    <!-- CỘT GIỮA -->
    <main class="main-content">
        <!-- Khung đồ thị 3D -->
        <div class="graph-container">
            <!-- Các nút điều khiển nằm gọn bên trong -->
            <div class="graph-search-wrapper">
                <input type="text" id="search-input" placeholder="Search nodes..." class="graph-search-input">
                <div id="search-dropdown" class="graph-search-dropdown"></div>
            </div>
            
            <button class="btn-center" onclick="window.doCenter()">Center View</button>
            
            <div id="graph-loading" class="graph-loading">Loading 3D...</div>
            <div id="3d-graph"></div>
            
            <div class="watermark">NeuroVault Architecture</div>
            
            <div class="graph-legend">
                <div class="legend-item"><span class="dot" style="background:#3b82f6;"></span> Math</div>
                <div class="legend-item"><span class="dot" style="background:#eab308;"></span> Python</div>
                <div class="legend-item"><span class="dot" style="background:#ef4444;"></span> SQL</div>
                <div class="legend-item"><span class="dot" style="background:#10a37f;"></span> Data Science</div>
            </div>
        </div>

        <!-- Khung Commit Log -->
        <div class="commit-log-container">
            <div class="commit-header">
                <span class="commit-title">Recent Knowledge Commits</span>
                <span class="commit-status">● Live</span>
            </div>
            <div class="commit-list" id="commit-log"></div>
        </div>
    </main>

    <!-- CỘT PHẢI -->
    <aside class="sidebar-right">
        <div class="sidebar-header">Phase 3 & 4</div>
        <div id="tree-right" style="margin-bottom: 2rem;"></div>
        
        <div class="detail-panel" id="detail-panel">
            <span class="panel-category">SECOND BRAIN NODE</span>
            <h3 class="panel-title" id="panel-title">Select a node</h3>
            <div class="panel-desc" id="panel-desc">Click on a node to view description.</div>
            <div class="panel-links" id="panel-links"></div>
        </div>
    </aside>
</div>
{% endblock %}
